<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eee9dd">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-f9+5kIjpYTGizplDarQvr0hy7KuTYqQDU77PfhYyezE='; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Page missing · Lost Formats Club</title>
  <link rel="icon" href="/assets/formats/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/formats/catalog.css">
  <script>/* GitHub Pages serves only this root 404 for unmatched paths. The app under /secret/ handles its own routing, so hand those back to it. The target is the directory (never index.html) so the prerendered state on the home page matches the path it is hydrated at. Paths under /kirk/ use that edition's own not-found page. Hash-pinned below; update the hash if this text changes. */
if (location.pathname.indexOf("/secret/") === 0) {
  location.replace("/secret/" + location.search + location.hash);
} else if (location.pathname === "/kirk" || location.pathname.indexOf("/kirk/") === 0) {
  location.replace("/kirk/404.html" + location.search + location.hash);
}</script>
</head>
<body>
  <header class="masthead page-width">
    <a href="/" class="wordmark" aria-label="Lost Formats Club home"><span class="brand-mark" aria-hidden="true"></span> L.F.C.</a>
    <nav aria-label="Main navigation">
      <a href="/#index">Format index</a>
      <a href="/#credits">Photo credits</a>
    </nav>
  </header>
  <main class="page-width not-found">
    <p class="label">Missing page</p>
    <h1>Out of the catalog</h1>
    <p>That address doesn’t lead to a page.</p>
    <a class="index-link" href="/">Back to Lost Formats Club</a>
  </main>
</body>
</html>
